<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flaski</title>
<meta name="description" content="Flashcards con repaso espaciado. Crea tus mazos, compártelos con tus amigos y estudia desde el móvil.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flaski">
<link rel="preload" href="fonts/atkinson-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="no-nav">
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">F</div><div><div class="name" id="appName">Flaski</div><div class="sub" id="appSub">Flashcards con repaso espaciado</div></div></div>
    <div id="net" class="net" role="status" hidden></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="main"><div class="empty"><div class="spin" aria-label="Cargando"></div></div></main>
</div>

<nav class="nav" id="nav" hidden aria-label="Secciones">
  <div class="nav-inner">
    <button data-nav="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /> <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /> <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></svg><span>Mis mazos</span></button>
    <button data-nav="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></svg><span>Apuntes</span></button>
    <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14" /> <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" /></svg><span>Estudiar</span></button>
    <button data-nav="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /></svg><span>Explorar</span></button>
    <button data-nav="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5" /> <path d="M20 21a8 8 0 0 0-16 0" /></svg><span>Perfil</span></button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true" id="sheetBody"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<input id="pdfFile" type="file" accept=".pdf,application/pdf" hidden>
<input id="noteFile" type="file" multiple accept=".pdf,.docx,.md,.markdown,.txt,.html,.htm,.csv,.tsv,.zip,image/*,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/markdown,text/plain,text/html,text/csv,application/zip" hidden>
  <input id="importFile" type="file" accept=".csv,.tsv,.txt,.json,.apkg,.colpkg,text/csv,text/plain,application/json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
