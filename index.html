  var b = ''; try { b = sessionStorage.getItem('flaski-bust') || ''; } catch (e) {}
  var q = '?v=' + V + (b ? '-' + b : ''), map = {};
  M.forEach(function (m) { map['./' + m] = './' + m + q; });

<script>
// Si un archivo de la app no carga o no casa con los demás (una versión vieja guardada que pide un archivo
// que ya no existe, o módulos de dos versiones), se borra lo guardado y se recarga, una sola vez
(function () {
  var KEY = 'flaski-recover';
  function recover() {
    if (navigator.onLine === false) return;   // sin conexión, lo guardado es lo único que hay
    try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, '1'); } catch (e) { return; }
    var jobs = [];
    if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /^flaski-v/.test(k); }).map(function (k) { return caches.delete(k); })); }));
    // Safari, al recargar, reutiliza los módulos que tiene en memoria: con una marca nueva en sus direcciones
    // (ver el import map de arriba) los pide otra vez
    try { sessionStorage.setItem('flaski-bust', String(Date.now())); } catch (e) {}
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  }
  addEventListener('error', function (e) {
    var t = e.target, src = t && (t.src || t.href) || '';
    if ((t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'modulepreload')) && /\/js\//.test(src))
      // Módulos de dos versiones: «does not provide an export named» (Chrome), «Importing binding name … is not found» (Safari), «import not found» (Firefox)
      || /does not provide an export named|Importing binding name .* is not found|import not found/.test(e.message || '')
      || (/Failed to fetch dynamically imported module/.test(e.message || '') && (e.message || '').indexOf(location.origin + '/js/') >= 0)) recover();
  }, true);
  // Si la app arranca bien (ya no está el esqueleto de carga), se puede volver a intentar en otra ocasión
  addEventListener('load', function () { setTimeout(function () { try { if (document.querySelector('#main > *') && !document.querySelector('#main > .skel')) sessionStorage.removeItem(KEY); } catch (e) {} }, 3000); });
  // Vigilante: los errores de antes de arrancar se guardan; si a los 15 s sigue el esqueleto, se dice qué ha pasado
  window.__bootErrors = [];
  addEventListener('error', function (e) { window.__bootErrors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
  addEventListener('unhandledrejection', function (e) { var r = e.reason; window.__bootErrors.push((r && (r.message || r)) + (r && r.stack ? ' · ' + String(r.stack).split('\n')[1] : '')); });
  setTimeout(function () {
    var m = document.getElementById('main');
    if (!m || !m.querySelector('.skel')) return;
    var errs = (window.__bootStep ? 'Paso: ' + window.__bootStep + '. ' : 'La app no ha llegado a arrancar. ') + (window.__bootErrors.slice(-3).join(' | ') || 'Sin errores: algo tarda demasiado en responder (la conexión o el servidor).');
    m.innerHTML = '<div class="panel boot-err"><h2>La app no termina de abrir</h2><p class="muted small"></p><button class="primary" onclick="location.reload()">Reintentar</button></div>';
    m.querySelector('p').textContent = errs;
  }, 15000);
})();
</script>
